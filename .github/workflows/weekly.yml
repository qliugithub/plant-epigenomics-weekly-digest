name: Weekly literature digest
on:
  schedule:
    - cron: '0 1 * * 5' # Friday 09:00 Asia/Singapore; GitHub may delay execution.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: weekly-digest
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and archive literature
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/update_digest.py
      - name: Commit archive
        run: |
          git config user.name 'Digest Bot'
          git config user.email 'digest-bot@users.noreply.github.com'
          git add dist/digest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive weekly plant epigenomics digest'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy archive
        id: deployment
        uses: actions/deploy-pages@v4
